<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas — InmoMarket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
        .sidebar { background: var(--dark); color: white; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; }
        .sidebar a { color: #94a3b8; padding: 0.75rem 1rem; border-radius: 6px; display: flex; align-items: center; gap: 0.75rem; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary); color: white; }
        .lead-card { background: white; padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <h2><i class="fa-solid fa-building-shield"></i> Panel</h2>
            <hr style="border:0; border-top:1px solid #334155; margin: 1rem 0;">
            <a href="dashboard.html">Inicio</a>
            <a href="mis-propiedades.html">Mis Propiedades</a>
            <a href="consultas.html" class="active">Consultas</a>
        </aside>

        <main style="padding: 2.5rem; background: #f8fafc; overflow-y: auto;">
            <h1 style="margin-bottom: 2rem;">Consultas Recibidas</h1>
            
            <div class="lead-card">
                <div>
                    <span style="background: #fef3c7; color: #92400e; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700;">NUEVA</span>
                    <h3 style="margin: 0.5rem 0 0.25rem 0;">Juan Pérez <span style="font-size: 0.85rem; color: var(--gray); font-weight:normal;">(juan@email.com)</span></h3>
                    <p style="font-size: 0.9rem; color: var(--gray-dark);">Hola, me interesa la propiedad ubicada en Nueva Córdoba. ¿Podemos coordinar una visita?</p>
                </div>
                <a href="https://wa.me/5493510000000" target="_blank" class="btn btn-accent btn-sm"><i class="fa-brands fa-whatsapp"></i> Responder</a>
            </div>

            <div class="lead-card">
                <div>
                    <span style="background: #e2e8f0; color: #475569; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700;">RESPONDIDA</span>
                    <h3 style="margin: 0.5rem 0 0.25rem 0;">María Gómez <span style="font-size: 0.85rem; color: var(--gray); font-weight:normal;">(maria@email.com)</span></h3>
                    <p style="font-size: 0.9rem; color: var(--gray-dark);">¿Cuál es el monto de las expensas aproximadas?</p>
                </div>
                <button class="btn btn-outline btn-sm" disabled>Respondida</button>
            </div>
        </main>
    </div>
</body>
</html>
