<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inmo — Tu Próximo Lugar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-building-shield"></i> Inmoventas</a>
            <nav class="nav-menu">
                <a href="propiedades.html?operation=comprar">Comprar</a>
                <a href="propiedades.html?operation=alquiler">Alquilar</a>
                <a href="propiedades.html">Propiedades</a>
                <a href="inmobiliarias.html">Inmobiliarias</a>
                <a href="planes.html">Planes</a>
                <a href="registro-inmobiliaria.html">Publicar propiedades</a>
            </nav>
            <div class="nav-actions">
                <a href="favoritos.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-heart"></i> Favoritos</a>
                <a href="login.html" class="btn btn-primary btn-sm">Iniciar sesión</a>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>Encontrá tu próximo lugar.</h1>
        <p>Todas las propiedades. Todas las inmobiliarias. En un solo lugar.</p>
        
        <form class="search-box" action="propiedades.html" method="GET">
            <div class="search-field">
                <label>Operación</label>
                <select name="operation">
                    <option value="">Todas</option>
                    <option value="comprar">Comprar</option>
                    <option value="alquiler">Alquilar</option>
                </select>
            </div>
            <div class="search-field">
                <label>Ubicación</label>
                <input type="text" name="city" placeholder="Ej: Córdoba, Carlos Paz">
            </div>
            <div class="search-field">
                <label>Tipo de Inmueble</label>
                <select name="type">
                    <option value="">Todos</option>
                    <option value="departamento">Departamento</option>
                    <option value="casa">Casa</option>
                    <option value="terreno">Terreno</option>
                    <option value="local">Local</option>
                    <option value="oficina">Oficina</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
        </form>
    </section>

    <main class="container">
        <h2 class="section-title">Propiedades Destacadas</h2>
        <div id="featured-properties" class="grid-cards"></div>

        <h2 class="section-title" style="margin-top: 4rem;">Explorar por Tipo</h2>
        <div class="categories-grid">
            <div class="category-card" onclick="location.href='propiedades.html?type=casa'">
                <i class="fa-solid fa-house"></i>
                <h3>Casas</h3>
            </div>
            <div class="category-card" onclick="location.href='propiedades.html?type=departamento'">
                <i class="fa-solid fa-building"></i>
                <h3>Departamentos</h3>
            </div>
            <div class="category-card" onclick="location.href='propiedades.html?type=terreno'">
                <i class="fa-solid fa-tree"></i>
                <h3>Terrenos</h3>
            </div>
            <div class="category-card" onclick="location.href='propiedades.html?type=local'">
                <i class="fa-solid fa-store"></i>
                <h3>Locales</h3>
            </div>
            <div class="category-card" onclick="location.href='propiedades.html?type=oficina'">
                <i class="fa-solid fa-briefcase"></i>
                <h3>Oficinas</h3>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script>
        function renderFeatured() {
            const props = getProperties().slice(0, 3);
            const container = document.getElementById('featured-properties');
            container.innerHTML = props.map(p => createPropertyCard(p)).join('');
        }
        renderFeatured();
    </script>
</body>
</html>
