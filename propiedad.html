<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Propiedad — InmoMarket</title>
   <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .property-detail-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .gallery-main {
            width: 100%;
            height: 450px;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
        }
        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-thumbs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .gallery-thumbs img {
            width: 100px;
            height: 75px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0.7;
            transition: var(--transition);
        }
        .gallery-thumbs img:hover, .gallery-thumbs img.active {
            opacity: 1;
            border: 2px solid var(--primary);
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        .detail-card {
            background: var(--white);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .agency-card-box {
            background: var(--white);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }
        .agency-card-box img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-building-shield"></i> InmoMarket</a>
            <nav class="nav-menu">
                <a href="propiedades.html">Propiedades</a>
                <a href="inmobiliarias.html">Inmobiliarias</a>
            </nav>
        </div>
    </header>

    <main class="property-detail-container" id="property-content">
        <!-- Renderizado dinámico por JS -->
    </main>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const propId = Number(params.get('id'));
        const props = getProperties();
        const agencies = getAgencies();
        const property = props.find(p => p.id === propId);

        const container = document.getElementById('property-content');

        if (!property) {
            container.innerHTML = `<h2>Propiedad no encontrada</h2><a href="propiedades.html" class="btn btn-primary" style="margin-top:1rem;">Ver catálogo</a>`;
        } else {
            const agency = agencies.find(a => a.id === property.agencyId) || agencies[0];
            
            // Buscar similares
            const similarProps = props.filter(p => p.id !== property.id && p.type === property.type && p.city === property.city).slice(0, 3);

            container.innerHTML = `
                <div style="margin-bottom: 1.5rem;">
                    <span class="card-badge" style="position:static; display:inline-block; margin-bottom:0.5rem;">${property.operation}</span>
                    <h1 style="font-size: 2rem; font-weight: 800;">${property.title}</h1>
                    <p style="color: var(--gray);"><i class="fa-solid fa-location-dot"></i> ${property.address}, ${property.neighborhood}, ${property.city}</p>
                </div>

                <div class="gallery-main">
                    <img id="main-img" src="${property.images[0]}" alt="${property.title}">
                </div>
                <div class="gallery-thumbs">
                    ${property.images.map((img, idx) => `<img src="${img}" class="${idx === 0 ? 'active' : ''}" onclick="changeImage('${img}', this)">`).join('')}
                </div>

                <div class="detail-grid">
                    <div>
                        <div class="detail-card">
                            <h2 style="font-size: 1.75rem; color: var(--primary); margin-bottom: 1rem;">${formatPrice(property.currency, property.price)}</h2>
                            <div class="card-features" style="margin-bottom: 1.5rem; font-size: 1rem;">
                                <span><i class="fa-solid fa-bed"></i> ${property.bedrooms} habitaciones</span>
                                <span><i class="fa-solid fa-bath"></i> ${property.bathrooms} baños</span>
                                <span><i class="fa-solid fa-ruler-combined"></i> ${property.area} m² cubiertos</span>
                            </div>
                            <h3 style="margin-bottom: 0.75rem;">Descripción</h3>
                            <p style="color: var(--gray-dark); line-height: 1.8;">${property.description}</p>
                        </div>
                    </div>

                    <div>
                        <div class="agency-card-box">
                            <p style="font-size: 0.8rem; color: var(--gray); text-transform: uppercase; font-weight: 700; margin-bottom: 0.5rem;">Publicado por</p>
                            <img src="${agency.logo}" alt="${agency.name}">
                            <h3 style="margin-bottom: 0.5rem;">${agency.name}</h3>
                            <p style="font-size: 0.9rem; color: var(--gray); margin-bottom: 1.5rem;">${agency.description.substring(0, 90)}...</p>
                            <a href="inmobiliaria.html?id=${agency.id}" class="btn btn-primary" style="width: 100%; margin-bottom: 0.75rem;">Ver inmobiliaria</a>
                            <a href="https://wa.me/${agency.whatsapp}?text=Hola,%20me%20interesa%20la%20propiedad:%20${encodeURIComponent(property.title)}" target="_blank" class="btn btn-accent" style="width: 100%;"><i class="fa-brands fa-whatsapp"></i> Consultar por WhatsApp</a>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 4rem;">
                    <h2 class="section-title">También podría interesarte</h2>
                    <div class="grid-cards">
                        ${similarProps.map(p => createPropertyCard(p)).join('')}
                    </div>
                </div>
            `;
        }

        function changeImage(src, element) {
            document.getElementById('main-img').src = src;
            document.querySelectorAll('.gallery-thumbs img').forEach(img => img.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
