<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Inmobiliaria — InmoMarket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .agency-hero {
            height: 300px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .agency-profile-box {
            max-width: 1200px;
            margin: -80px auto 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            position: relative;
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        .agency-profile-box img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-building-shield"></i> InmoMarket</a>
        </div>
    </header>

    <div id="agency-container"></div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const agencyId = Number(params.get('id')) || 1;
        const agencies = getAgencies();
        const agency = agencies.find(a => a.id === agencyId) || agencies[0];
        const props = getProperties().filter(p => p.agencyId === agency.id);

        document.getElementById('agency-container').innerHTML = `
            <div class="agency-hero" style="background-image: url('${agency.banner}')"></div>
            <div class="agency-profile-box">
                <img src="${agency.logo}" alt="${agency.name}">
                <div>
                    <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">${agency.name}</h1>
                    <p style="color: var(--gray); margin-bottom: 0.5rem;"><i class="fa-solid fa-location-dot"></i> ${agency.address}, ${agency.city} | <i class="fa-solid fa-phone"></i> ${agency.phone}</p>
                    <p style="color: var(--gray-dark);">${agency.description}</p>
                </div>
            </div>

            <main class="container">
                <h2 class="section-title">Propiedades de ${agency.name} (${props.length})</h2>
                <div class="grid-cards">
                    ${props.map(p => createPropertyCard(p)).join('')}
                </div>
            </main>
        `;
    </script>
</body>
</html>
