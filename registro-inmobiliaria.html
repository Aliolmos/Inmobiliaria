<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Inmobiliaria — InmoMarket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container { max-width: 550px; margin: 4rem auto; background: white; padding: 2.5rem; border-radius: var(--radius); box-shadow: var(--shadow-lg); }
    </style>
</head>
<body style="background: #f1f5f9;">
    <div class="auth-container">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1.5rem;"><i class="fa-solid fa-building-shield"></i> InmoMarket</a>
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Publicá tus propiedades</h2>
        <p style="text-align: center; color: var(--gray); font-size: 0.9rem; margin-bottom: 2rem;">Creá tu cuenta institucional en segundos.</p>
        
        <form onsubmit="handleRegister(event)" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:0.3rem;">Nombre de la Inmobiliaria</label>
                <input type="text" required style="width:100%; padding:0.7rem; border:1px solid #cbd5e1; border-radius:6px;" placeholder="Ej: Inmobiliaria del Sol">
            </div>
            <div>
                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:0.3rem;">Email Institucional</label>
                <input type="email" required style="width:100%; padding:0.7rem; border:1px solid #cbd5e1; border-radius:6px;" placeholder="contacto@inmobsol.com">
            </div>
            <div>
                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:0.3rem;">Ciudad</label>
                <input type="text" required style="width:100%; padding:0.7rem; border:1px solid #cbd5e1; border-radius:6px;" placeholder="Ej: Córdoba">
            </div>
            <div>
                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:0.3rem;">Contraseña</label>
                <input type="password" required style="width:100%; padding:0.7rem; border:1px solid #cbd5e1; border-radius:6px;" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Continuar a Planes</button>
        </form>
    </div>

    <script src="js/utils.js"></script>
    <script>
        function handleRegister(e) {
            e.preventDefault();
            showToast("Registro completado con éxito");
            setTimeout(() => { window.location.href = 'planes.html'; }, 1200);
        }
    </script>
</body>
</html>
