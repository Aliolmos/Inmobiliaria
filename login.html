<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — InmoMarket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container { max-width: 450px; margin: 6rem auto; background: white; padding: 2.5rem; border-radius: var(--radius); box-shadow: var(--shadow-lg); }
    </style>
</head>
<body style="background: #f1f5f9;">
    <div class="auth-container">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 2rem;"><i class="fa-solid fa-building-shield"></i> InmoMarket</a>
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Iniciar Sesión</h2>
        <form onsubmit="handleLogin(event)">
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:0.5rem;">Email</label>
                <input type="email" required style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;" placeholder="admin@inmobiliaria.com">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:0.5rem;">Contraseña</label>
                <input type="password" required style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar al Panel</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--gray);">¿No tenés cuenta? <a href="registro-inmobiliaria.html" style="color: var(--primary); font-weight:600;">Registrar Inmobiliaria</a></p>
    </div>

    <script src="js/utils.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            showToast("Inicio de sesión exitoso");
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
        }
    </script>
</body>
</html>
