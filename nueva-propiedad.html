<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Propiedad — InmoMarket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
        .sidebar { background: var(--dark); color: white; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; }
        .sidebar a { color: #94a3b8; padding: 0.75rem 1rem; border-radius: 6px; display: flex; align-items: center; gap: 0.75rem; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary); color: white; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <h2><i class="fa-solid fa-building-shield"></i> Panel</h2>
            <hr style="border:0; border-top:1px solid #334155; margin: 1rem 0;">
            <a href="dashboard.html">Inicio</a>
            <a href="mis-propiedades.html">Mis Propiedades</a>
            <a href="nueva-propiedad.html" class="active">Nueva Propiedad</a>
        </aside>

        <main style="padding: 2.5rem; background: #f8fafc; overflow-y: auto;">
            <h1 style="margin-bottom: 2rem;">Publicar Nueva Propiedad</h1>
            
            <form id="property-form" style="background: white; padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem;" onsubmit="handlePublish(event)">
                <div style="grid-column: 1 / -1;">
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Título de la Propiedad</label>
                    <input type="text" id="title" required style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;" placeholder="Ej: Moderno Departamento 2 Dormitorios">
                </div>

                <div>
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Operación</label>
                    <select id="operation" style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;">
                        <option value="alquiler">Alquiler</option>
                        <option value="venta">Venta</option>
                    </select>
                </div>

                <div>
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Tipo de Inmueble</label>
                    <select id="type" style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;">
                        <option value="departamento">Departamento</option>
                        <option value="casa">Casa</option>
                        <option value="terreno">Terreno</option>
                        <option value="local">Local</option>
                        <option value="oficina">Oficina</option>
                    </select>
                </div>

                <div>
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Moneda</label>
                    <select id="currency" style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;">
                        <option value="$">$ (Pesos)</option>
                        <option value="USD">USD (Dólares)</option>
                    </select>
                </div>

                <div>
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Precio</label>
                    <input type="number" id="price" required style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;" placeholder="Ej: 450000">
                </div>

                <div>
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Ciudad</label>
                    <input type="text" id="city" required style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;" placeholder="Ej: Córdoba">
                </div>

                <div>
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Barrio</label>
                    <input type="text" id="neighborhood" required style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;" placeholder="Ej: Nueva Córdoba">
                </div>

                <div>
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Habitaciones</label>
                    <input type="number" id="bedrooms" value="1" style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;">
                </div>

                <div>
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Baños</label>
                    <input type="number" id="bathrooms" value="1" style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;">
                </div>

                <div style="grid-column: 1 / -1;">
                    <label style="display:block; font-weight:600; margin-bottom:0.5rem;">Descripción</label>
                    <textarea id="description" rows="4" required style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px;"></textarea>
                </div>

                <div style="grid-column: 1 / -1;">
                    <button type="submit" class="btn btn-primary">Publicar Propiedad</button>
                </div>
            </form>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script>
        function handlePublish(e) {
            e.preventDefault();
            const props = getProperties();
            const newProp = {
                id: Date.now(),
                title: document.getElementById('title').value,
                operation: document.getElementById('operation').value,
                type: document.getElementById('type').value,
                currency: document.getElementById('currency').value,
                price: Number(document.getElementById('price').value),
                city: document.getElementById('city').value,
                neighborhood: document.getElementById('neighborhood').value,
                address: "Dirección principal",
                bedrooms: Number(document.getElementById('bedrooms').value),
                bathrooms: Number(document.getElementById('bathrooms').value),
                area: 70,
                description: document.getElementById('description').value,
                agencyId: 1,
                agency: "Inmobiliaria Norte",
                images: ["https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=1000&q=80"],
                date: new Date().toISOString().split('T')[0],
                status: "PUBLICADA"
            };

            props.unshift(newProp);
            localStorage.setItem('properties', JSON.stringify(props));
            showToast("Propiedad publicada correctamente.");
            setTimeout(() => {
                window.location.href = 'mis-propiedades.html';
            }, 1500);
        }
    </script>
</body>
</html>
