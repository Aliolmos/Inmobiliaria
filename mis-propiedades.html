<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Propiedades — InmoMarket</title>
   <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
        .sidebar { background: var(--dark); color: white; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; }
        .sidebar a { color: #94a3b8; padding: 0.75rem 1rem; border-radius: 6px; display: flex; align-items: center; gap: 0.75rem; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary); color: white; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        th { background: #f8fafc; font-weight: 700; color: var(--gray-dark); }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <h2><i class="fa-solid fa-building-shield"></i> Panel</h2>
            <hr style="border:0; border-top:1px solid #334155; margin: 1rem 0;">
            <a href="dashboard.html">Inicio</a>
            <a href="mis-propiedades.html" class="active">Mis Propiedades</a>
            <a href="nueva-propiedad.html">Nueva Propiedad</a>
        </aside>

        <main style="padding: 2.5rem; background: #f8fafc; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1>Mis Propiedades</h1>
                <a href="nueva-propiedad.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Nueva Propiedad</a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Propiedad</th>
                        <th>Operación</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script>
        function renderTable() {
            const props = getProperties().filter(p => p.agencyId === 1);
            const tbody = document.getElementById('table-body');
            
            if (props.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--gray);">No tenés propiedades publicadas.</td></tr>`;
                return;
            }

            tbody.innerHTML = props.map(p => `
                <tr>
                    <td style="font-weight: 600;">${p.title}</td>
                    <td style="text-transform: uppercase; font-size: 0.8rem; font-weight:700;">${p.operation}</td>
                    <td>${formatPrice(p.currency, p.price)}</td>
                    <td><span style="background: #dcfce7; color: #166534; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight:700;">${p.status}</span></td>
                    <td>
                        <a href="propiedad.html?id=${p.id}" target="_blank" class="btn btn-outline" style="padding: 0.3rem 0.6rem; font-size:0.8rem;"><i class="fa-solid fa-eye"></i></a>
                        <button class="btn" style="background: #fee2e2; color: #991b1b; padding: 0.3rem 0.6rem; font-size:0.8rem;" onclick="deleteProp(${p.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteProp(id) {
            if (confirm("¿Estás seguro de eliminar esta propiedad?")) {
                let props = getProperties();
                props = props.filter(p => p.id !== id);
                localStorage.setItem('properties', JSON.stringify(props));
                showToast("Propiedad eliminada correctamente");
                renderTable();
            }
        }

        renderTable();
    </script>
</body>
</html>
